<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  File: src/main/resources/templates/layout.html
  Layout chung: khai bao Bootstrap 5, jQuery 3.7.1 va bien contextPath.
  Cac trang khac nhung 2 fragment: head-common va scripts-common.
-->
<head th:fragment="head-common">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<!-- Thanh dieu huong dung chung -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">WEBPR330479</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/category}">Danh muc</a>
            <a class="nav-link" th:href="@{/product}">San pham</a>
            <a class="nav-link" href="/swagger-ui/index.html" target="_blank">Swagger</a>
        </div>
    </div>
</nav>

<!-- Script dung chung -->
<th:block th:fragment="scripts-common">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!--
      Bien contextPath: duong dan goc cua ung dung.
      - Thymeleaf: dung th:inline="javascript" va @{/}
      - Neu ban dung JSP + SiteMesh thi thay bang:
            <script>var contextPath = "${pageContext.request.contextPath}";</script>
        hoac voi JSTL:
            <c:set var="contextPath" value="${pageContext.request.contextPath}"/>
            <script>var contextPath = "${contextPath}";</script>
    -->
    <script th:inline="javascript">
        var contextPath = /*[[@{/}]]*/ '/';
        // Bo dau / thua o cuoi de ghep chuoi cho dep
        if (contextPath.endsWith('/')) {
            contextPath = contextPath.slice(0, -1);
        }
    </script>
    <script th:src="@{/js/main.js}"></script>
</th:block>
</body>
</html>
