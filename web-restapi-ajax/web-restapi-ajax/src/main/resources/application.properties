# ===== THONG TIN UNG DUNG =====
spring.application.name=web-restapi-ajax
server.port=8082

# ===== KET NOI SQL SERVER (doi lai cho dung may cua ban) =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=WebPRDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YourStrong@Passw0rd
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===== UPLOAD FILE =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
storage.location=uploads

# ===== BAT HiddenHttpMethodFilter =====
# Cho phep gui POST kem tham so _method=PUT/DELETE, Spring se doi method lai
# -> giai quyet van de multipart khong parse duoc voi PUT
spring.mvc.hiddenmethod.filter.enabled=true

# ===== SWAGGER (springdoc) =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===== ENCODING =====
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===== THYMELEAF =====
spring.thymeleaf.cache=false
