<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  File: src/main/resources/templates/layout.html
  Layout chung cho project GraphQL.
-->
<head th:fragment="head-common">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">WEBPR330479 - GraphQL</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">Trang chu</a>
            <a class="nav-link" th:href="@{/category-manage}">Danh muc</a>
            <a class="nav-link" th:href="@{/product-manage}">San pham</a>
            <a class="nav-link" href="/graphiql" target="_blank">GraphiQL</a>
        </div>
    </div>
</nav>

<th:block th:fragment="scripts-common">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!--
      contextPath cho Thymeleaf.
      Neu dung JSP + SiteMesh: <script>var contextPath = "${pageContext.request.contextPath}";</script>
    -->
    <script th:inline="javascript">
        var contextPath = /*[[@{/}]]*/ '/';
        if (contextPath.endsWith('/')) {
            contextPath = contextPath.slice(0, -1);
        }
    </script>
    <script th:src="@{/js/graphql.js}"></script>
</th:block>
</body>
</html>
