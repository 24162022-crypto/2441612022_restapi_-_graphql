# ===== THONG TIN UNG DUNG =====
spring.application.name=web-graphql-ajax
server.port=8082

# ===== KET NOI SQL SERVER (doi lai cho dung may cua ban) =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=WebPRDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YourStrong@Passw0rd
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===== GRAPHQL =====
# Bat giao dien GraphiQL de test truc tiep tren trinh duyet
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
# In schema ra endpoint /graphql/schema de kiem tra
spring.graphql.schema.printer.enabled=true
# Duong dan file schema (mac dinh da la classpath:graphql/**/)
spring.graphql.schema.locations=classpath:graphql/

# ===== UPLOAD FILE =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
storage.location=uploads

# ===== ENCODING =====
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===== THYMELEAF =====
spring.thymeleaf.cache=false
